name: Build iOS Simulator App for Appetize

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-simulator:
    name: Compile iOS Simulator Build
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16 (Swift 6.0)
        run: |
          echo "🔍 Selecting Xcode 16..."
          XCODE_16=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_16" ]; then
            echo "Selecting: $XCODE_16"
            sudo xcode-select -s "$XCODE_16"
          fi
          swift --version

      - name: Run Automated Tests
        run: |
          swift test

      - name: Compile App for iOS Simulator
        run: |
          set -e
          SIM_SDK_PATH=$(xcrun --sdk iphonesimulator --show-sdk-path)
          echo "SDK Path: $SIM_SDK_PATH"
          
          swift build -c release \
            --triple arm64-apple-ios17.0-simulator \
            --sdk "$SIM_SDK_PATH" \
            --product MovieSocialApp

          echo "📦 Assembling iOS .app bundle..."
          mkdir -p build/MovieSocialApp.app
          
          COMPILED_BIN=$(find .build -name "MovieSocialApp" -type f -perm +111 | grep -i "simulator" | head -n 1)
          if [ -z "$COMPILED_BIN" ]; then
            COMPILED_BIN=$(find .build -name "MovieSocialApp" -type f -perm +111 | head -n 1)
          fi
          echo "Using binary: $COMPILED_BIN"
          
          cp "$COMPILED_BIN" build/MovieSocialApp.app/MovieSocialApp
          cp Info-iOS.plist build/MovieSocialApp.app/Info.plist

      - name: Upload .app Directly for Appetize
        uses: actions/upload-artifact@v4
        with:
          name: MovieSocialApp.app
          path: build/MovieSocialApp.app
          retention-days: 7
