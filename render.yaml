services:
  - type: web
    name: moviesocial-api
    env: python
    region: ohio
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false # Pega aquí tu URL de conexión de Neon DB
